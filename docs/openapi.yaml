  /api/admin/verifiers:
    get:
      operationId: adminListVerifiers
      summary: List verifier profiles with aggregate stats
      description: Returns verifier profiles ordered by the underlying table order.
        `limit` is clamped to 200 and defaults to 50; invalid values fall back
        to the defaults.
      tags:
        - Admin Verifiers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated verifier profiles with aggregate verification stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierListResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/VerifierErrorResponse"
    post:
      operationId: adminCreateVerifier
      summary: Create a verifier profile
      description: "`userId` must be a valid Stellar public key. When `status` is
        omitted the profile is created as `pending`. A unique-constraint
        violation returns 409."
      tags:
        - Admin Verifiers
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerifierRequest"
      responses:
        "201":
          description: Verifier profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierCreateResponse"
        "400":
          description: Missing userId, invalid Stellar public key, non-string displayName,
            non-object metadata or invalid status
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/VerifierErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierErrorResponse"
        "409":
          description: Verifier already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifierErrorResponse"
