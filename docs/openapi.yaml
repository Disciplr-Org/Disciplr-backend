          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                query_definition:
                  $ref: "#/components/schemas/SavedSearchQueryDefinition"
                alerts_enabled:
                  type: boolean
                  default: false
                alert_recipient:
                  type: string
                  description: Required when alerts_enabled is true
                alert_frequency_ms:
                  type: integer
                  minimum: 3600000
