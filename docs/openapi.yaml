openapi: 3.1.0
info:
  title: Disciplr API
  version: 0.1.0
  description: API documentation for Disciplr backend
servers:
  - url: /api
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaginationCursor:
      type: object
      properties:
        limit:
          type: number
        cursor:
          type: string
        next_cursor:
          type: string
        has_more:
          type: boolean
        count:
          type: number
      required:
        - limit
        - has_more
        - count
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request parameters
            details: {}
            requestId:
              type: string
              example: req_123
          required:
            - code
            - message
      required:
        - error
    Vault:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creator:
          type: string
        amount:
          type: string
        status:
          type: string
          enum:
            - active
            - completed
            - failed
            - cancelled
        startTimestamp:
          type: string
          format: date-time
        endTimestamp:
          type: string
          format: date-time
        successDestination:
          type: string
        failureDestination:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - creator
        - amount
        - status
        - startTimestamp
        - endTimestamp
        - successDestination
        - failureDestination
        - createdAt
    Milestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vaultId:
          type: string
          format: uuid
        description:
          type: string
        status:
          type: string
          enum:
            - pending
            - verified
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
      required:
        - id
        - vaultId
        - description
        - status
        - createdAt
    VerifierProfile:
      type: object
      properties:
        userId:
          type: string
          description: Stellar public key that identifies the verifier
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
        displayName:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
          additionalProperties: {}
        status:
          type: string
          enum:
            - pending
            - approved
            - suspended
            - deactivated
          description: "Verifier lifecycle status. Allowed transitions:
            pending→approved|deactivated, approved→suspended|deactivated,
            suspended→approved|deactivated, deactivated→pending|approved."
          example: approved
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type:
            - string
            - "null"
          format: date-time
        suspendedAt:
          type:
            - string
            - "null"
          format: date-time
        deactivatedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - userId
        - status
        - createdAt
    VerifierStats:
      type: object
      properties:
        totalVerifications:
          type: integer
          example: 12
        approvals:
          type: integer
          example: 9
        rejections:
          type: integer
          example: 3
        disputes:
          type: integer
          example: 1
        approvalRatio:
          type: number
          example: 0.75
        rejectionRatio:
          type: number
          example: 0.25
        disputeRate:
          type: number
          example: 0.0833
      required:
        - totalVerifications
        - approvals
        - rejections
        - disputes
        - approvalRatio
        - rejectionRatio
        - disputeRate
    VerifierWithStats:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/VerifierProfile"
        stats:
          $ref: "#/components/schemas/VerifierStats"
      required:
        - profile
        - stats
    VerifierPagination:
      type: object
      properties:
        limit:
          type: integer
          description: Page size in effect (max 200)
          example: 50
        offset:
          type: integer
          description: Zero-based offset of the first item
          example: 0
        count:
          type: integer
          description: Number of items in this page
          example: 2
        hasMore:
          type: boolean
          description: Whether another page is likely available
          example: false
      required:
        - limit
        - offset
        - count
        - hasMore
    VerifierListResponse:
      type: object
      properties:
        verifiers:
          type: array
          items:
            $ref: "#/components/schemas/VerifierWithStats"
        pagination:
          $ref: "#/components/schemas/VerifierPagination"
      required:
        - verifiers
        - pagination
    VerifierCreateResponse:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/VerifierProfile"
        stats:
          $ref: "#/components/schemas/VerifierStats"
        auditLogId:
          type: string
          description: Audit log entry id when one was written
      required:
        - profile
        - stats
    VerifierMutationResponse:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/VerifierProfile"
        stats:
          $ref: "#/components/schemas/VerifierStats"
        auditLogId:
          type:
            - string
            - "null"
          description: Audit log entry id, or null when the request was a no-op
        changedFields:
          type: array
          items:
            type: string
          description: Profile fields changed by this request
          example:
            - status
      required:
        - profile
        - stats
        - auditLogId
        - changedFields
    CreateVerifierRequest:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          description: Stellar public key of the verifier to create
          example: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
        displayName:
          type: string
        metadata:
          type: object
          additionalProperties: {}
        status:
          type: string
          enum:
            - pending
            - approved
            - suspended
            - deactivated
          description: "Verifier lifecycle status. Allowed transitions:
            pending→approved|deactivated, approved→suspended|deactivated,
            suspended→approved|deactivated, deactivated→pending|approved."
          example: approved
        reason:
          type: string
          description: Reason recorded on the audit log entry
      required:
        - userId
    UpdateVerifierRequest:
      type: object
      properties:
        displayName:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
          additionalProperties: {}
        status:
          type: string
          enum:
            - pending
            - approved
            - suspended
            - deactivated
          description: "Verifier lifecycle status. Allowed transitions:
            pending→approved|deactivated, approved→suspended|deactivated,
            suspended→approved|deactivated, deactivated→pending|approved."
          example: approved
        reason:
          type: string
          description: Reason recorded on the audit log entry
    VerifierReasonRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reason recorded on the audit log entry
    VerifierErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: verifier not found
      required:
        - error
    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
            - csv
            - json
          description: Output format for the export
          example: json
        scope:
          type: string
          enum:
            - vaults
            - transactions
            - analytics
            - all
          description: Data scope for the export
          example: all
        targetUserId:
          type: string
          description: Target user ID (admin-only exports)
          example: user_123
      required:
        - format
        - scope
    ExportJobResponse:
      type: object
      properties:
        jobId:
          type: string
          description: Export job identifier
          example: job_abc123
        statusUrl:
          type: string
          description: URL to poll for job status
          example: /api/exports/status/job_abc123
        pollIntervalMs:
          type: number
          description: Recommended polling interval in milliseconds
          example: 1000
      required:
        - jobId
        - statusUrl
        - pollIntervalMs
    ExportJobStatus:
      type: object
      properties:
        jobId:
          type: string
          example: job_abc123
        status:
          type: string
          enum:
            - pending
            - running
            - done
            - failed
          example: done
        attempts:
          type: number
          example: 1
        maxAttempts:
          type: number
          example: 3
        completedAt:
          type: string
          format: date-time
          example: 2026-06-02T10:00:00Z
        downloadUrl:
          type: string
          description: Download URL (present when status is done)
          example: /api/exports/download/token_xyz
        expiresInSeconds:
          type: number
          example: 3600
        error:
          type: string
          description: Error message if status is failed
      required:
        - jobId
        - status
        - attempts
        - maxAttempts
    PagePagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
      required:
        - page
        - pageSize
        - total
        - totalPages
        - hasNext
        - hasPrev
    OrgVault:
      type: object
      properties:
        id:
          type: string
        creator:
          type: string
        verifier:
          type: string
        amount:
          type: string
          example: "100.0000000"
        status:
          type: string
          enum:
            - draft
            - active
            - completed
            - failed
            - cancelled
        orgId:
          type: string
        startTimestamp:
          type: string
          format: date-time
        endTimestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - creator
        - verifier
        - amount
        - status
        - orgId
        - startTimestamp
        - endTimestamp
        - createdAt
        - updatedAt
    SavedSearchQueryDefinition:
      type: object
      properties:
        q:
          type: string
          maxLength: 200
          description: Free-text search term (sanitized)
        status:
          type: string
          enum:
            - draft
            - active
            - completed
            - failed
            - cancelled
        verifier:
          type: string
          maxLength: 256
        amount_min:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: Inclusive lower amount bound
        amount_max:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: Inclusive upper amount bound
        date_from:
          type: string
          description: ISO 8601 date or timestamp (inclusive lower created_at bound)
        date_to:
          type: string
          description: ISO 8601 date or timestamp (inclusive upper created_at bound)
        sort_by:
          type: string
          enum:
            - created_at
            - amount
            - end_date
            - status
        sort_order:
          type: string
          enum:
            - asc
            - desc
        limit:
          type: integer
          minimum: 1
          maximum: 100
    OrgVaultSearch:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
          example: High-value active vaults
        query_definition:
          $ref: "#/components/schemas/SavedSearchQueryDefinition"
        alerts_enabled:
          type: boolean
        alert_recipient:
          type:
            - string
            - "null"
        alert_frequency_ms:
          type: integer
          example: 3600000
        last_evaluated_at:
          type:
            - string
            - "null"
          format: date-time
        last_result_hash:
          type:
            - string
            - "null"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - org_id
        - name
        - query_definition
        - alerts_enabled
        - alert_recipient
        - alert_frequency_ms
        - last_evaluated_at
        - last_result_hash
        - created_by
        - created_at
        - updated_at
    OrgVaultSearchResult:
      type: object
      properties:
        id:
          type: string
        creator:
          type: string
        verifier:
          type: string
        amount:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - completed
            - failed
            - cancelled
        organization_id:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - creator
        - verifier
        - amount
        - status
        - organization_id
        - start_date
        - end_date
        - created_at
        - updated_at
    OrgAnalytics:
      type: object
      properties:
        orgId:
          type: string
        analytics:
          type: object
          properties:
            totalCapital:
              type: string
              example: "4200.0000000"
            successRate:
              type: number
              description: completed / (completed + failed)
              example: 0.75
            activeVaults:
              type: integer
            completedVaults:
              type: integer
            failedVaults:
              type: integer
          required:
            - totalCapital
            - successRate
            - activeVaults
            - completedVaults
            - failedVaults
        teamPerformance:
          type: array
          items:
            type: object
            properties:
              creator:
                type: string
              vaultCount:
                type: integer
              totalAmount:
                type: string
              successRate:
                type: number
            required:
              - creator
              - vaultCount
              - totalAmount
              - successRate
        generatedAt:
          type: string
          format: date-time
      required:
        - orgId
        - analytics
        - teamPerformance
        - generatedAt
    OrgRiskAnalytics:
      type: object
      properties:
        orgId:
          type: string
        generatedAt:
          type: string
          format: date-time
        range:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
          required:
            - startDate
            - endDate
        analytics:
          type: object
          properties:
            totalVaults:
              type: integer
            activeVaults:
              type: integer
            resolvedVaults:
              type: integer
            slashedVaults:
              type: integer
            slashRate:
              type: number
            capitalAtRisk:
              type: string
          required:
            - totalVaults
            - activeVaults
            - resolvedVaults
            - slashedVaults
            - slashRate
            - capitalAtRisk
      required:
        - orgId
        - generatedAt
        - range
        - analytics
    CohortRetention:
      type: object
      properties:
        cohorts:
          type: array
          items:
            type: object
            properties:
              cohort_period:
                type: string
                example: 2026-01
              cohort_size:
                type: integer
              retained_count:
                type: integer
              retention_rate:
                type: number
                description: Fraction in [0, 1]
            required:
              - cohort_period
              - cohort_size
              - retained_count
              - retention_rate
        range:
          type:
            - integer
            - "null"
        generatedAt:
          type: string
          format: date-time
      required:
        - cohorts
        - range
        - generatedAt
    TeamRollup:
      type: object
      properties:
        orgId:
          type: string
        teams:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
              name:
                type: string
              slug:
                type: string
              vaultCount:
                type: integer
              totalCapital:
                type: string
              activeVaults:
                type: integer
              completedVaults:
                type: integer
              failedVaults:
                type: integer
              milestoneCount:
                type: integer
              milestonesCompleted:
                type: integer
              slashRate:
                type: number
            required:
              - teamId
              - name
              - slug
              - vaultCount
              - totalCapital
              - activeVaults
              - completedVaults
              - failedVaults
              - milestoneCount
              - milestonesCompleted
              - slashRate
        orgTotals:
          type: object
          properties:
            vaultCount:
              type: integer
            totalCapital:
              type: string
            activeVaults:
              type: integer
            completedVaults:
              type: integer
            failedVaults:
              type: integer
            milestoneCount:
              type: integer
            milestonesCompleted:
              type: integer
            slashRate:
              type: number
            teamCount:
              type: integer
          required:
            - vaultCount
            - totalCapital
            - activeVaults
            - completedVaults
            - failedVaults
            - milestoneCount
            - milestonesCompleted
            - slashRate
            - teamCount
        generatedAt:
          type: string
          format: date-time
      required:
        - orgId
        - teams
        - orgTotals
        - generatedAt
    OrgAnalyticsReport:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        snapshotAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
        downloadUrl:
          type:
            - string
            - "null"
          description: Signed S3 URL or local download path
      required:
        - id
        - orgId
        - snapshotAt
        - createdAt
        - sizeBytes
        - downloadUrl
    ApiKeyMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type:
            - string
            - "null"
        orgId:
          type:
            - string
            - "null"
          format: uuid
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - read:analytics
              - read:vaults
              - write:analytics
              - write:vaults
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        requestCount:
          type: integer
        lastIp:
          type:
            - string
            - "null"
      required:
        - id
        - userId
        - orgId
        - label
        - scopes
        - createdAt
        - revokedAt
  parameters: {}
paths:
  /api/health:
    get:
      summary: Check API health
      tags:
        - Health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                  service:
                    type: string
                  jobs: {}
                required:
                  - status
                  - timestamp
                  - uptime
                  - service
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum:
                    - USER
                    - VERIFIER
                    - ADMIN
              required:
                - email
                - password
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema: {}
  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: {}
  /api/vaults:
    get:
      summary: List vaults
      tags:
        - Vaults
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated list of vaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vault"
                  pagination: {}
                required:
                  - data
    post:
      summary: Create a new vault
      tags:
        - Vaults
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                creator:
                  type: string
                amount:
                  type: string
                endTimestamp:
                  type: string
                  format: date-time
                successDestination:
                  type: string
                failureDestination:
                  type: string
                milestones:
                  type: array
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                    required:
                      - description
              required:
                - creator
                - amount
                - endTimestamp
                - successDestination
                - failureDestination
      responses:
        "201":
          description: Vault created
          content:
            application/json:
              schema: {}
  /api/vaults/{vaultId}/milestones:
    get:
      summary: Get milestones for a vault
      tags:
        - Milestones
      parameters:
        - name: vaultId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones:
                    type: array
                    items:
                      $ref: "#/components/schemas/Milestone"
                required:
                  - milestones
  /api/jobs/enqueue:
    post:
      summary: Enqueue a background job
      tags:
        - Jobs
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                payload: {}
                delayMs:
                  type: number
                maxAttempts:
                  type: number
              required:
                - type
      responses:
        "202":
          description: Job enqueued
          content:
            application/json:
              schema: {}
  /api/analytics/summary:
    get:
      summary: Get analytics summary
      tags:
        - Analytics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema: {}
  /api/jobs/metrics:
    get:
      summary: Get queue metrics
      tags:
        - Jobs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean
                  queueDepth:
                    type: number
                  delayedJobs:
                    type: number
                  activeJobs:
                    type: number
                  totals:
                    type: object
                    properties:
                      executions:
                        type: number
                      failed:
                        type: number
                    required:
                      - executions
                      - failed
                required:
                  - running
                  - queueDepth
                  - delayedJobs
                  - activeJobs
                  - totals
  /api/jobs/deadletters:
    get:
      summary: List dead-letter jobs
      tags:
        - Jobs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of dead-letter jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  deadLetters:
                    type: array
                    items: {}
                required:
                  - deadLetters
  /api/jobs/deadletters/{id}:
    get:
      summary: Get a dead-letter job by ID
      tags:
        - Jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dead-letter job details
        "404":
          description: Job not found
  /api/jobs/deadletters/{id}/replay:
    post:
