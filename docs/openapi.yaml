    post:
      summary: Create a saved vault search
      description: Creates a saved search for the org. Requires owner/admin. Each org
        may keep at most 20 saved searches; when alerts are enabled the
        recipient is required and the frequency must be at least one hour.
      tags:
        - Org Vaults
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            example: org_123
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                query_definition:
                  $ref: "#/components/schemas/SavedSearchQueryDefinition"
                alerts_enabled:
                  type: boolean
                  default: false
                alert_recipient:
                  type: string
                  description: Required when alerts_enabled is true
                alert_frequency_ms:
                  type: integer
                  minimum: 3600000
                  description: Minimum 3600000 (1 hour)
                  example: 3600000
              required:
                - name
                - query_definition
      responses:
