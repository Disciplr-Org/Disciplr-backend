    get:
      summary: Search an organization's vaults
      description: Full-text search (tsvector with an ILIKE fallback) plus structured
        filters, cursor-paginated on (created_at DESC, id DESC).
      tags:
        - Org Vaults
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            example: org_123
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
            description: Sanitized free-text term
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - active
              - completed
              - failed
              - cancelled
        - name: verifier
          in: query
          schema:
            type: string
        - name: amount_min
          in: query
          schema:
            type: string
        - name: amount_max
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            description: ISO 8601 lower bound on created_at
        - name: date_to
          in: query
          schema:
            type: string
            description: ISO 8601 upper bound on created_at
        - name: cursor
          in: query
          schema:
            type: string
            description: Opaque cursor from a previous page
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching vaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgVaultSearchResult"
                  pagination:
                    $ref: "#/components/schemas/PaginationCursor"
                required:
                  - data
                  - pagination
        "400":
          description: Invalid cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
