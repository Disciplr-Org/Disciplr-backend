  /api/oauth/token:
    post:
      operationId: exchangeApiKeyForOAuthToken
      summary: Exchange API key credentials for an OAuth access token
      description: Describes the OAuth router contract. Availability depends on the
        deployment mounting the router at this path.
      tags:
        - API Keys
      security: []
      servers:
        - url: /
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                client_id:
                  type: string
                  format: uuid
                client_secret:
                  type: string
                  minLength: 1
                  maxLength: 512
                  writeOnly: true
                scope:
                  type: string
                  maxLength: 256
                  description: Space-separated scopes. Omitted or blank uses all client grants. Up
                    to 20 distinct scopes, each at most 64 characters.
              required:
                - grant_type
                - client_id
                - client_secret
      responses:
        "200":
          description: Access token issued
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    minimum: 60
                    maximum: 43200
                  scope:
                    type: string
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - scope
        "400":
          description: Unsupported grant, malformed request, or invalid scope
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                required:
                  - error
                  - error_description
        "401":
          description: Invalid client credentials
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
